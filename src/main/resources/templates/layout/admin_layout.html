<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="'BookingDom Admin'"></title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #DAEFFF;
      --primary-dark: #000000;
      --sidebar-width: 260px;
      --card-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
      --card-border-radius: 1rem;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa !important;
      color: #000000 !important;
    }

    .admin-sidebar {
      width: var(--sidebar-width);
      min-height: calc(100vh - 80px);
      background-color: #AED6F1 !important;
    }

    .admin-header,
    .admin-footer .container-fluid {
      background-color: #AED6F1 !important;
    }

    /* Force global text color to black */
    *,
    p,
    span,
    div,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    a,
    li,
    td,
    th {
      color: #000000 !important;
    }

    .nav-link {
      color: #555;
      padding: 0.85rem 1.25rem;
      border-radius: 0.75rem;
      margin: 0.4rem 1rem;
      transition: all 0.3s;
      font-weight: 600;
      display: flex;
      align-items: center;
    }

    .nav-link:hover,
    .nav-link.active {
      background: rgba(52, 152, 219, 0.15);
      color: #3498DB !important;
      transform: translateX(5px);
    }

    .nav-link i {
      font-size: 1.25rem;
      width: 30px;
    }

    .stat-card {
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      border-radius: var(--card-border-radius);
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1) !important;
    }

    .card {
      border: 1px solid #dee2e6 !important;
      border-radius: var(--card-border-radius);
      background-color: #ffffff !important;
    }

    .bg-white {
      background-color: #ffffff !important;
    }

    /* === Brand Color Overrides === */
    .bg-primary {
      background-color: #DAEFFF !important;
    }

    .text-primary {
      color: #333 !important;
    }

    .border-primary {
      border-color: #DAEFFF !important;
    }

    .bg-primary.bg-opacity-10 {
      background-color: rgba(218, 239, 255, 0.3) !important;
    }

    .btn-primary {
      background-color: #DAEFFF !important;
      border-color: #DAEFFF !important;
      color: #000 !important;
    }

    .btn-primary:hover {
      background-color: #BEDBFF !important;
      border-color: #BEDBFF !important;
      color: #000 !important;
    }

    .btn-outline-primary {
      color: #333 !important;
      border-color: #DAEFFF !important;
    }

    .btn-outline-primary:hover {
      background-color: #DAEFFF !important;
      color: #000 !important;
    }

    .btn-dark {
      background-color: #000000 !important;
      border-color: #000000 !important;
    }

    .pagination {
      gap: 5px;
    }

    .page-link {
      color: #000;
      border: none;
      font-weight: 600;
      border-radius: 50px !important;
      min-width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      transition: all 0.3s;
      background-color: #ffffff;
      padding: 0 15px;
    }

    .page-item.active .page-link,
    .page-item.active span.page-link {
      background-color: #3498DB !important;
      color: #ffffff !important;
      box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
    }

    .page-link:hover {
      background-color: #AED6F1;
      color: #000000;
      transform: translateY(-2px);
    }

    .page-item.disabled .page-link {
      background-color: #f8f9fa;
      color: #adb5bd;
      box-shadow: none;
      transform: none;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: #DAEFFF;
      box-shadow: 0 0 0 0.2rem rgba(218, 239, 255, 0.4);
    }

    a {
      color: #000000;
    }

    a:hover {
      color: #333;
    }

    .text-warning,
    .nav-link:hover .bi-play-circle,
    .nav-link:hover .bi-star {
      color: #21618C !important;
    }

    .badge.bg-warning,
    .bg-warning {
      background-color: #3498DB !important;
      color: #000 !important;
    }

    .border-warning {
      border-color: #3498DB !important;
    }

    .btn-warning {
      background-color: #3498DB !important;
      color: #000 !important;
      border-color: #3498DB !important;
    }

    .btn-warning:hover {
      background-color: #2874A6 !important;
      color: #fff !important;
    }

    .tour-card {
      text-decoration: none;
    }

    /* Đổi màu nền outline hover cho toàn bộ admin giống với layout user */
    [class*="btn-outline-"]:hover {
      background-color: #AED6F1 !important;
      color: #000000 !important;
      border-color: #AED6F1 !important;
    }
  </style>
</head>
<header th:fragment="header()">
  <section class="admin-header w-100 px-0 py-0 border-bottom">
    <div class="d-flex justify-content-between align-items-center px-4">
      <div class="d-flex align-items-center gap-2">
        <img th:src="@{/favicon.icon}" alt="Logo" height="80" class="rounded">
        <h3 class="fw-bold mb-0 text-dark"></h3>
      </div>
      <div class="d-flex align-items-center gap-3">
        <a th:href="@{/}" class="btn btn-outline-dark btn-sm shadow-sm">
          <i class="bi bi-window me-1"></i>
          Client
        </a>
        <form th:action="@{/logout}" method="post" class="mb-0">
          <button type="submit" class="btn btn-outline-danger btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i>
            Đăng xuất
          </button>
        </form>
      </div>
    </div>
  </section>
</header>
<nav th:fragment="nav()" class="admin-sidebar border-end bg-white py-4 d-flex flex-column">

  <div class="px-4 mb-3 text-uppercase fw-bold text-muted" style="font-size: 0.75rem; letter-spacing: 1px;">
    Thống kê & Báo cáo
  </div>
  <ul class="nav flex-column mb-4">
    <li class="nav-item">
      <a class="nav-link" th:href="@{/admin}">
        <i class="bi bi-grid-1x2-fill me-2"></i> Tổng quan Dashboard
      </a>
    </li>
  </ul>

  <div class="px-4 mb-3 text-uppercase fw-bold text-muted" style="font-size: 0.75rem; letter-spacing: 1px;">
    Quản trị Hệ thống
  </div>
  <ul class="nav flex-column mb-4">
    <li class="nav-item">
      <a class="nav-link" th:href="@{/admin/user}">
        <i class="bi bi-people-fill me-2"></i> Người dùng
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link d-flex justify-content-between align-items-center" data-bs-toggle="collapse" href="#tourMenu"
        role="button" aria-expanded="false" aria-controls="tourMenu">
        <div>
          <i class="bi bi-luggage-fill me-2"></i> Điều hành Tour
        </div>
        <i class="bi bi-chevron-down small text-muted"></i>
      </a>
      <div class="collapse ps-3" id="tourMenu">
        <ul class="nav flex-column mt-2">
          <li class="nav-item">
            <a class="nav-link py-2" th:href="@{/admin/tour/active}" style="font-size: 0.9rem;">
              <i class="bi bi-record-circle text-primary me-2"></i> Đang hoạt động
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link py-2" th:href="@{/admin/tour/completed}" style="font-size: 0.9rem;">
              <i class="bi bi-check2-circle text-secondary me-2"></i> Tour đã đóng
            </a>
          </li>
        </ul>
      </div>
    </li>
  </ul>

  <div class="px-4 mb-3 text-uppercase fw-bold text-muted" style="font-size: 0.75rem; letter-spacing: 1px;">
    Tương tác Khách hàng
  </div>
  <ul class="nav flex-column pb-4 mb-auto">
    <li class="nav-item">
      <a class="nav-link position-relative" th:href="@{/admin/contact}">
        <i class="bi bi-envelope-paper-fill me-2"></i> Hòm thư liên hệ
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:href="@{/admin/danh-gia}">
        <i class="bi bi-star-fill me-2 text-warning"></i> Quản lý Đánh giá
      </a>
    </li>
  </ul>
</nav>

<footer th:fragment="footer()" class="admin-footer mt-auto">
  <div class="container-fluid py-3 border-top">
    <div class="d-flex justify-content-center align-items-center small text-muted">
      © 2026 ZakiBooking Admin
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    (function () {
      const path = window.location.pathname;
      document.querySelectorAll('.admin-sidebar .nav-link').forEach(function (link) {
        const href = link.getAttribute('href');
        if (!href) return;
        if (href === '/admin' && path === '/admin') {
          link.classList.add('active');
        }
        else if (href !== '/admin' && path.startsWith(href)) {
          link.classList.add('active');
          var collapse = link.closest('.collapse');
          if (collapse) {
            collapse.classList.add('show');
          }
        }
      });
    })();
  </script>
</footer>
