<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - BookingDom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body class="font-sans text-slate-800 relative min-h-screen flex items-center justify-center p-4">
    
    <div class="fixed inset-0 z-0">
        <div class="absolute inset-0 bg-gradient-to-b from-sky-500 via-sky-200 to-white">
        </div>
    </div>

    
    <div
        class="glass-card w-full max-w-lg rounded-3xl shadow-2xl p-8 sm:p-10 relative z-20 my-8 transition-all duration-300 hover:shadow-3xl">
        <div class="flex flex-col items-center mb-6">
            <img th:src="@{/favicon.icon}" alt="Logo" class="h-16 w-auto object-contain mb-3">
            <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight text-center">Tạo tài khoản mới</h2>
            <p class="text-slate-500 font-medium mt-1 text-center">Bắt đầu hành trình khám phá cùng BookingDom</p>
        </div>

        <div th:if="${errorMessage}"
            class="mb-5 p-4 bg-red-50/90 border border-red-200 rounded-2xl flex items-center gap-3 text-red-600 shadow-sm">
            <span class="text-xl">⚠️</span>
            <p class="text-sm font-bold" th:text="${errorMessage}"></p>
        </div>
        <div th:if="${successMessage}"
            class="mb-5 p-4 bg-green-50/90 border border-green-200 rounded-2xl flex items-center gap-3 text-green-600 shadow-sm">
            <span class="text-xl">✓</span>
            <p class="text-sm font-bold" th:text="${successMessage}"></p>
        </div>

        <form th:action="@{/register}" method="post" class="space-y-4" autocomplete="off">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-1.5 ml-1">Tên đăng
                        nhập</label>
                    <input type="text" name="tenDangNhap" th:value="${nguoiDung.tenDangNhap}" placeholder="username"
                        required
                        class="w-full px-5 py-3.5 bg-white/70 border border-white/50 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-[#3498DB]/30 focus:border-[#3498DB] focus:bg-white transition-all duration-200 shadow-inner">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-1.5 ml-1">Họ và
                        tên</label>
                    <input type="text" name="hoTen" th:value="${nguoiDung.hoTen}" placeholder="Nguyễn Văn A" required
                        class="w-full px-5 py-3.5 bg-white/70 border border-white/50 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-[#3498DB]/30 focus:border-[#3498DB] focus:bg-white transition-all duration-200 shadow-inner">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-1.5 ml-1">Số điện
                        thoại</label>
                    <input type="tel" name="number" th:value="${nguoiDung.number}" placeholder="0901234567" required
                        class="w-full px-5 py-3.5 bg-white/70 border border-white/50 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-[#3498DB]/30 focus:border-[#3498DB] focus:bg-white transition-all duration-200 shadow-inner">
                </div>
                <div>
                    <label
                        class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-1.5 ml-1">Email</label>
                    <input type="email" name="email" th:value="${nguoiDung.email}" placeholder="example@email.com"
                        required
                        class="w-full px-5 py-3.5 bg-white/70 border border-white/50 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-[#3498DB]/30 focus:border-[#3498DB] focus:bg-white transition-all duration-200 shadow-inner">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-1.5 ml-1">Mật
                        khẩu</label>
                    <div class="relative">
                        <input type="password" id="password" name="matKhau" placeholder="••••••••" required
                            class="w-full px-5 py-3.5 bg-white/70 border border-white/50 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-[#3498DB]/30 focus:border-[#3498DB] focus:bg-white transition-all duration-200 shadow-inner pr-12">
                        <button type="button" onclick="togglePass('password')"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 transition-colors">👁️
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-widest mb-1.5 ml-1">Xác
                        nhận</label>
                    <div class="relative">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••"
                            required
                            class="w-full px-5 py-3.5 bg-white/70 border border-white/50 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-[#3498DB]/30 focus:border-[#3498DB] focus:bg-white transition-all duration-200 shadow-inner pr-12">
                        <button type="button" onclick="togglePass('confirmPassword')"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 transition-colors">👁️
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-3 pt-2 pb-1 ml-1">
                <input type="checkbox" id="terms" required
                    class="w-4 h-4 rounded-md border-slate-300 text-[#3498DB] focus:ring-[#3498DB] cursor-pointer shadow-sm">
                <label for="terms" class="text-sm font-medium text-slate-600">
                    Tôi đồng ý với <a href="#" class="text-[#3498DB] hover:underline font-bold">Điều khoản</a> và
                    <a href="#" class="text-[#3498DB] hover:underline font-bold">Chính sách bảo mật</a>
                </label>
            </div>

            <div class="pt-2">
                <button type="submit"
                    class="w-full py-4 bg-gradient-to-r from-[#3498DB] to-[#2E86C1] text-white text-lg font-extrabold rounded-2xl hover:from-[#2980B9] hover:to-[#21618C] focus:ring-4 focus:ring-[#3498DB]/40 transition-all duration-300 shadow-lg transform hover:-translate-y-0.5">
                    Bắt đầu hành trình ngay
                </button>
            </div>
        </form>

        <div class="flex items-center gap-4 my-6 opacity-70">
            <div class="flex-1 h-px bg-slate-300"></div>
            <span class="text-xs font-black text-slate-500 uppercase tracking-widest">Đã có tài khoản?</span>
            <div class="flex-1 h-px bg-slate-300"></div>
        </div>

        <div class="text-center">
            <a th:href="@{/login}"
                class="inline-flex w-full justify-center py-3.5 bg-white/60 border border-slate-200 text-slate-700 font-bold rounded-2xl hover:bg-white focus:ring-4 focus:ring-slate-200 transition-all duration-200 shadow-sm">
                Đăng nhập ngay
            </a>
        </div>
    </div>
    <script>
        function togglePass(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>

</html>
