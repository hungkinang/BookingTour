<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - BookingDom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.css" rel="stylesheet">
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body class="font-sans text-slate-800 relative min-h-screen flex items-center justify-center p-4">
    
    <div class="fixed inset-0 z-0">
        <div class="absolute inset-0 bg-gradient-to-b from-sky-500 via-sky-200 to-white">
        </div>
    </div>

    
    <div
        class="glass-card w-full max-w-md rounded-3xl shadow-2xl p-8 sm:p-10 relative z-20 transition-all duration-300 hover:shadow-3xl">
        <div class="flex flex-col items-center mb-8">
            <img th:src="@{/favicon.icon}" alt="Logo" class="h-16 w-auto object-contain mb-4">
            <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight text-center">Đăng nhập</h2>
            <p class="text-slate-500 font-medium mt-1 text-center">Tiếp tục hành trình kỳ thú của bạn</p>
        </div>

        <div th:if="${param.error}"
            class="mb-5 p-4 bg-red-50/90 border border-red-200 text-red-600 text-sm rounded-2xl font-medium shadow-sm">
            Tên đăng nhập hoặc mật khẩu không chính xác.
        </div>

        <div th:if="${successMessage}"
            class="mb-5 p-4 bg-green-50/90 border border-green-200 text-green-600 text-sm rounded-2xl font-medium shadow-sm">
            <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/perform-login}" method="post" class="space-y-5" autocomplete="off">
            <div>
                <label for="username" class="block text-sm font-bold text-slate-700 mb-1.5 ml-1">Email / Tên đăng
                    nhập</label>
                <input type="text" id="username" name="username" placeholder="example@email.com" required
                    class="w-full px-5 py-3.5 bg-white/70 border border-white/50 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-[#3498DB]/30 focus:border-[#3498DB] focus:bg-white transition-all duration-200 shadow-inner" />
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5 ml-1">
                    <label for="password" class="block text-sm font-bold text-slate-700">Mật khẩu</label>
                    <a href="#" class="text-xs font-bold text-[#3498DB] hover:text-[#2874A6] transition-colors">Quên mật
                        khẩu?</a>
                </div>
                <div class="relative">
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                        class="w-full px-5 py-3.5 bg-white/70 border border-white/50 rounded-2xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-[#3498DB]/30 focus:border-[#3498DB] focus:bg-white transition-all duration-200 shadow-inner pr-12" />
                    <button type="button" onclick="togglePassword()"
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 focus:outline-none transition-colors">
                        <span id="eye-icon">👁️</span>
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-3 pt-1 ml-1">
                <input type="checkbox" name="remember-me" id="remember-me"
                    class="w-4 h-4 rounded-md border-slate-300 text-[#3498DB] focus:ring-[#3498DB]/40 focus:ring-2 cursor-pointer transition-colors shadow-sm" />
                <label for="remember-me" class="text-sm font-bold text-slate-600 cursor-pointer select-none">Ghi nhớ
                    đăng nhập</label>
            </div>

            <div class="pt-3">
                <button type="submit"
                    class="w-full py-4 bg-gradient-to-r from-[#3498DB] to-[#2E86C1] text-white text-lg font-extrabold rounded-2xl hover:from-[#2980B9] hover:to-[#21618C] focus:ring-4 focus:ring-[#3498DB]/40 transition-all duration-300 shadow-lg transform hover:-translate-y-0.5">
                    Đăng nhập
                </button>
            </div>

            <div>
                <a th:href="@{/}"
                    class="flex items-center justify-center w-full py-3.5 bg-white/60 border border-slate-200 text-slate-700 font-bold rounded-2xl hover:bg-white focus:ring-4 focus:ring-slate-200 transition-all duration-200 shadow-sm">
                    Tiếp tục với tư cách khách
                </a>
            </div>
        </form>

        <div class="flex items-center gap-4 my-7 opacity-70">
            <div class="flex-1 h-px bg-slate-300"></div>
            <span class="text-xs font-black text-slate-500 uppercase tracking-widest">Hoặc đăng nhập với</span>
            <div class="flex-1 h-px bg-slate-300"></div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <a href="/oauth2/authorization/google" class="block">
                <button type="button"
                    class="w-full py-3 bg-white border border-slate-100 rounded-2xl text-slate-700 hover:bg-slate-50 hover:shadow-md focus:ring-4 focus:ring-slate-100 transition-all flex items-center justify-center gap-2 font-bold shadow-sm">
                    <svg class="w-5 h-5 text-red-500" viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Google
                </button>
            </a>
            <a href="/oauth2/authorization/facebook" class="block">
                <button type="button"
                    class="w-full py-3 bg-white border border-slate-100 rounded-2xl text-slate-700 hover:bg-slate-50 hover:shadow-md focus:ring-4 focus:ring-slate-100 transition-all flex items-center justify-center gap-2 font-bold shadow-sm">
                    <svg class="w-5 h-5 text-[#1877F2]" viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.99 3.66 9.13 8.44 9.88v-6.99H7.9v-2.89h2.54V9.41c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.2 2.23.2v2.46h-1.25c-1.23 0-1.61.77-1.61 1.56v1.87h2.74l-.44 2.89h-2.3v6.99C18.34 21.13 22 16.99 22 12z" />
                    </svg>
                    Facebook
                </button>
            </a>
        </div>

        <p class="text-center text-slate-600 font-bold mt-7">
            Người mới?
            <a th:href="@{/register}" class="text-[#3498DB] hover:text-[#21618C] transition-colors hover:underline">Tạo
                tài khoản ngay</a>
        </p>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = '👁️';
            }
        }
    </script>
</body>

</html>
