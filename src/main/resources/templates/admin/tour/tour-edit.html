<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{layout/admin_layout :: head('Cập nhật chuyến đi')}"></head>

<body>
  <header th:replace="~{layout/admin_layout:: header()}"></header>
  <div class="d-flex bg-light min-vh-100">
    <nav th:replace="~{layout/admin_layout :: nav()}"></nav>
    <div class="container-fluid p-4">
      
      
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-1">
              <li class="breadcrumb-item"><a th:href="@{/admin/tour/active}" class="text-decoration-none text-muted fw-bold">Chuyến đi</a></li>
              <li class="breadcrumb-item active text-dark fw-bold" aria-current="page">Sửa đổi nội dung</li>
            </ol>
          </nav>
          <h3 class="fw-bolder mb-0 text-dark">
             <i class="bi bi-pencil-square text-primary me-2"></i>Cập Nhật Chuyến Đi
          </h3>
        </div>
        <a th:href="@{'/admin/tour/detail/' + ${tour.id}}" class="btn btn-outline-dark btn-sm rounded-pill px-3 fw-bold shadow-sm bg-white">
            <i class="bi bi-arrow-left me-1"></i> Trở về Chi tiết
        </a>
      </div>

      <form th:action="@{'/admin/tour/update/' + ${tour.id}}" th:object="${tour}" method="post" enctype="multipart/form-data" autocomplete="off">
        <div class="row g-4">
          
          <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 mb-4">
              <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <h5 class="fw-bold"><i class="bi bi-info-circle text-primary me-2"></i>Thông tin cơ bản</h5>
              </div>
              <div class="card-body p-4">
                <div class="row g-3">
                  <div class="col-12">
                    <label class="form-label fw-semibold text-muted small text-uppercase">Tên / Tiêu đề chuyến đi <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{tieuDe}" class="form-control form-control-lg bg-light" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold text-muted small text-uppercase">Giá gốc (VND) <span class="text-danger">*</span></label>
                    <div class="input-group">
                      <input type="number" th:field="*{gia}" class="form-control bg-light" min="0" required>
                      <span class="input-group-text bg-white border-start-0 fw-bold">₫</span>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold text-muted small text-uppercase">Nhãn Nổi Bật</label>
                    <div class="d-flex gap-3 align-items-center mt-2">
                       <div class="form-check form-check-inline">
                         <input class="form-check-input" type="radio" th:field="*{noiBat}" th:value="true" id="yes">
                         <label class="form-check-label fw-bold" for="yes"><span class="badge bg-warning text-dark"><i class="bi bi-star-fill me-1"></i>Bật</span></label>
                       </div>
                       <div class="form-check form-check-inline">
                         <input class="form-check-input" type="radio" th:field="*{noiBat}" th:value="false" id="no">
                         <label class="form-check-label fw-bold text-muted" for="no">Tắt</label>
                       </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="card border-0 shadow-sm rounded-4 mb-4">
              <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <h5 class="fw-bold"><i class="bi bi-body-text text-primary me-2"></i>Nội dung & Highlight</h5>
              </div>
              <div class="card-body p-4">
                <div class="row g-4">
                  <div class="col-12">
                    <label class="form-label fw-semibold text-muted small text-uppercase">Điểm nhấn chuyến đi (Highlight)</label>
                    <textarea th:field="*{highlight}" class="form-control bg-light" rows="3"></textarea>
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-semibold text-muted small text-uppercase">Mô tả đầy đủ (Description)</label>
                    <textarea th:field="*{moTa}" class="form-control bg-light" rows="5"></textarea>
                  </div>
                </div>
              </div>
            </div>
          </div>

          
          <div class="col-lg-4">
            
            <div class="card border-0 shadow-sm rounded-4 mb-4">
              <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <h5 class="fw-bold"><i class="bi bi-geo-alt text-primary me-2"></i>Hành trình</h5>
              </div>
              <div class="card-body p-4">
                <div class="row g-3">
                  <div class="col-6">
                    <label class="form-label fw-semibold text-muted small">Khởi hành <span class="text-danger">*</span></label>
                    <input type="date" th:field="*{ngayKhoiHanh}" th:min="${tour.id == null ? #temporals.format(#temporals.createNow(),'yyyy-MM-dd') : null}" class="form-control bg-light" required>
                  </div>
                  <div class="col-6">
                    <label class="form-label fw-semibold text-muted small">Kết thúc <span class="text-danger">*</span></label>
                    <input type="date" th:field="*{ngayKetThuc}" th:attr="min=${#temporals.format(#temporals.createNow(),'yyyy-MM-dd')}" class="form-control bg-light" required>
                  </div>
                  
                  <div class="col-12">
                     <hr class="text-muted opacity-25">
                  </div>

                  <div class="col-6">
                    <label class="form-label fw-semibold text-muted small">Châu lục</label>
                    <select id="chauLuc" class="form-select bg-light" th:attr="data-selected=${selectedChauLuc}">
                      <option value="">-- Chọn --</option>
                      <option value="Trong nước">Trong nước</option>
                      <option value="Châu Á">Châu Á</option>
                      <option value="Châu Âu">Châu Âu</option>
                      <option value="Châu Mỹ">Châu Mỹ</option>
                    </select>
                  </div>
                  <div class="col-6">
                    <label class="form-label fw-semibold text-muted small">Quốc gia</label>
                    <select id="quocGia" class="form-select bg-light" th:attr="data-selected=${selectedQuocGia}">
                      <option value="">-- Tùy chọn --</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-semibold text-muted small">Thành phố đến</label>
                    <select id="thanhPho" class="form-select bg-light" th:field="*{idDiemDen.id}" th:attr="data-selected=${selectedThanhPho}">
                      <option value="">-- Chọn thành phố --</option>
                    </select>
                  </div>
                  
                  <div class="col-12">
                    <label class="form-label fw-semibold text-muted small">Nơi lưu trú</label>
                    <select id="noiLuuTru" class="form-select bg-light" th:field="*{idNoiLuuTru.id}" th:attr="data-selected=${tour.idNoiLuuTru != null ? tour.idNoiLuuTru.id : ''}">
                      <option value="">-- Chọn nơi lưu trú --</option>
                    </select>
                  </div>

                  <div class="col-12">
                     <hr class="text-muted opacity-25">
                  </div>

                  <div class="col-12">
                    <label class="form-label fw-semibold text-muted small">Nơi đón khách</label>
                    <select class="form-select bg-light" th:field="*{idDiemDon.id}">
                      <option th:each="dd : ${diemDonList}" th:value="${dd.id}" th:text="${dd.ten}"></option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-semibold text-muted small">Phương tiện di chuyển</label>
                    <select class="form-select bg-light" th:field="*{idPhuongTien.id}">
                      <option th:each="pt : ${phuongTienList}" th:value="${pt.id}" th:text="${pt.loai}"></option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <div class="card border-0 shadow-sm rounded-4 mb-4">
              <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <h5 class="fw-bold"><i class="bi bi-image text-primary me-2"></i>Ảnh đại diện</h5>
              </div>
              <div class="card-body p-4 text-center">
                <div class="mb-3">
                   <img th:src="@{${tour.hinhAnh}}" alt="Tour Picture" class="rounded-4 shadow-sm w-100" style="height: 180px; object-fit: cover;">
                </div>
                <label class="form-label text-start w-100 small fw-bold text-muted">Thay thế ảnh mới (Nếu có)</label>
                <input type="file" name="file" class="form-control" accept="image/*">
              </div>
            </div>

            <div class="d-grid gap-2">
               <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm">
                 <i class="bi bi-save me-1"></i> Lưu Thay Đổi
               </button>
            </div>
            
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    const dataDiaDiem = {
      "Trong nước": {
        "Việt Nam": [
          { id: 1, ten: "Sapa" }, { id: 2, ten: "Hạ Long" }, { id: 3, ten: "Đà Nẵng" },
          { id: 4, ten: "Huế" }, { id: 5, ten: "Phú Quốc" }, { id: 6, ten: "Cần Thơ" }
        ]
      },
      "Châu Á": {
        "Thái Lan": [{ id: 7, ten: "Bangkok" }],
        "Singapore": [{ id: 8, ten: "Singapore" }],
        "Hàn Quốc": [{ id: 9, ten: "Seoul" }]
      },
      "Châu Âu": {
        "Pháp": [{ id: 10, ten: "Paris" }],
        "Đức": [{ id: 11, ten: "Berlin" }]
      },
      "Châu Mỹ": {
        "Mỹ": [{ id: 12, ten: "New York" }],
        "Canada": [{ id: 13, ten: "Toronto" }]
      }
    };

    const chauLucSelect = document.getElementById("chauLuc");
    const quocGiaSelect = document.getElementById("quocGia");
    const thanhPhoSelect = document.getElementById("thanhPho");
    const noiLuuTruSelect = document.getElementById("noiLuuTru");

    document.addEventListener("DOMContentLoaded", function() {
        const selectedChauLuc = chauLucSelect.getAttribute("data-selected");
        const selectedQuocGia = quocGiaSelect.getAttribute("data-selected");
        const selectedThanhPho = thanhPhoSelect.getAttribute("data-selected");
        const selectedNoiLuuTru = noiLuuTruSelect.getAttribute("data-selected");
        
        if(selectedChauLuc) {
            chauLucSelect.value = selectedChauLuc;
            const event = new Event('change');
            chauLucSelect.dispatchEvent(event);
            if(selectedQuocGia) {
                quocGiaSelect.value = selectedQuocGia;
                quocGiaSelect.dispatchEvent(event);
                if(selectedThanhPho) {
                    thanhPhoSelect.value = selectedThanhPho;
                    loadAccommodations(selectedThanhPho, selectedNoiLuuTru);
                }
            }
        }
    });

    function loadAccommodations(diemDenId, selectedNoiLuuTruId) {
      noiLuuTruSelect.innerHTML = '<option value="">-- Chọn nơi lưu trú --</option>';
      if (!diemDenId) return;

      fetch(`/api/dia-diem/noi-luu-tru?diemDenId=${diemDenId}`)
        .then(response => response.json())
        .then(data => {
          data.forEach(nlt => {
            const option = document.createElement("option");
            option.value = nlt.id;
            option.textContent = nlt.ten + " (" + nlt.loai + ")";
            if (selectedNoiLuuTruId && nlt.id == selectedNoiLuuTruId) {
              option.selected = true;
            }
            noiLuuTruSelect.appendChild(option);
          });
        })
        .catch(error => console.error("Error fetching accommodations:", error));
    }

    chauLucSelect.addEventListener("change", function () {
      const chauLuc = this.value;
      quocGiaSelect.innerHTML = '<option value="">-- Chọn --</option>';
      thanhPhoSelect.innerHTML = '<option value="">-- Thành phố --</option>';
      noiLuuTruSelect.innerHTML = '<option value="">-- Chọn nơi lưu trú --</option>';
      if (!dataDiaDiem[chauLuc]) return;
      Object.keys(dataDiaDiem[chauLuc]).forEach(qg => {
        const option = document.createElement("option");
        option.value = qg; option.textContent = qg;
        quocGiaSelect.appendChild(option);
      });
    });

    quocGiaSelect.addEventListener("change", function () {
      const chauLuc = chauLucSelect.value;
      const quocGia = this.value;
      thanhPhoSelect.innerHTML = '<option value="">-- Thành phố --</option>';
      noiLuuTruSelect.innerHTML = '<option value="">-- Chọn nơi lưu trú --</option>';
      if (!dataDiaDiem[chauLuc] || !dataDiaDiem[chauLuc][quocGia]) return;
      dataDiaDiem[chauLuc][quocGia].forEach(tp => {
        const option = document.createElement("option");
        option.value = tp.id; option.textContent = tp.ten;
        thanhPhoSelect.appendChild(option);
      });
    });

    thanhPhoSelect.addEventListener("change", function () {
      loadAccommodations(this.value, null);
    });
  </script>

</body>
<footer th:replace="~{layout/admin_layout :: footer()}"></footer>
</html>
