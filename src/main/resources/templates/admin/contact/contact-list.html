<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{layout/admin_layout :: head('Quản lý Liên Hệ')}"></head>

<body>
  <header th:replace="~{layout/admin_layout:: header()}"></header>
  <div class="d-flex">
    <nav th:replace="~{layout/admin_layout :: nav()}"></nav>

    <div class="container-fluid p-4 bg-light flex-grow-1">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="fw-bolder mb-1 text-dark"><i class="bi bi-envelope-paper me-2 text-primary"></i>Danh sách hòm thư
          </h3>
          <p class="text-secondary small mb-0">Quản lý và phản hồi các yêu cầu từ phía khách hàng</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-dark btn-sm rounded-pill fw-bold" onclick="window.location.reload()">
            <i class="bi bi-arrow-clockwise me-1"></i> Làm mới
          </button>
        </div>
      </div>

      
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 border-0">
              <thead class="table-light">
                <tr class="text-uppercase small text-muted tracking-wider">
                  <th class="ps-4 fw-bold border-0">Khách Hàng</th>
                  <th class="fw-bold border-0">Phân Loại</th>
                  <th class="fw-bold border-0">Số Khách</th>
                  <th class="fw-bold border-0">Ngày Gửi</th>
                  <th class="fw-bold border-0 text-center">Trạng Thái</th>
                  <th class="text-center pe-4 fw-bold border-0">Thao Tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="c : ${contacts}" class="border-bottom border-light">
                  <td class="ps-4 py-3">
                    <div class="d-flex align-items-center gap-3">
                      <div class="rounded-circle d-flex align-items-center justify-content-center bg-primary"
                        style="width: 40px; height: 40px;">
                        <span class="fs-5 fw-bold text-white" th:text="${c.name.substring(0,1).toUpperCase()}"></span>
                      </div>
                      <div>
                        <h6 class="fw-bold mb-0 text-dark" th:text="${c.name}"></h6>
                        <small class="text-secondary" th:text="${c.email}"></small>
                      </div>
                    </div>
                  </td>
                  <td>
                    <span class="badge rounded-pill border fw-bold text-dark px-3 py-2 bg-light shadow-sm"
                      th:if="${c.type == 'TOUR'}"><i class="bi bi-map me-1 text-success"></i> Đặt Tour</span>
                    <span class="badge rounded-pill border fw-bold text-dark px-3 py-2 bg-light shadow-sm"
                      th:if="${c.type == 'SUPPORT'}"><i class="bi bi-headset me-1 text-primary"></i> Hỗ Trợ</span>
                    <span class="badge rounded-pill border fw-bold text-dark px-3 py-2 bg-light shadow-sm"
                      th:if="${c.type != 'TOUR' and c.type != 'SUPPORT'}"><i
                        class="bi bi-question-circle me-1 text-warning"></i> Khác</span>
                  </td>
                  <td>
                    <span class="fw-semibold text-dark"><i class="bi bi-people-fill text-muted me-1"></i> <span
                        th:text="${c.guest_number ?: 'N/A'}"></span></span>
                  </td>
                  <td>
                    <span class="text-secondary small fw-medium"
                      th:text="${#temporals.format(c.createdAt,'dd/MM/yyyy')}"></span><br>
                    <span class="text-muted small" th:text="${#temporals.format(c.createdAt,'HH:mm')}"></span>
                  </td>
                  <td class="text-center">
                    <span th:if="${c.status == 'NEW'}"
                      class="badge bg-danger rounded-pill px-3 py-2 shadow-sm fw-bold">Mới Nhận</span>
                    <span th:if="${c.status == 'READ'}"
                      class="badge bg-success rounded-pill px-3 py-2 shadow-sm fw-bold text-white">Đã Xử Lý</span>
                  </td>
                  <td class="text-center pe-4">
                    <a th:href="@{'/admin/contact/' + ${c.id}}" class="btn btn-sm btn-outline-primary rounded-circle"
                      style="width: 32px; height: 32px;" title="Xem chi tiết">
                      <i class="bi bi-eye"></i>
                    </a>
                  </td>
                </tr>

                
                <tr th:if="${#lists.isEmpty(contacts)}">
                  <td colspan="6" class="text-center py-5">
                    <div class="py-4">
                      <i class="bi bi-inbox fs-1 text-muted opacity-50 mb-3 block"></i>
                      <h5 class="fw-bolder text-dark">Hòm thư trống</h5>
                      <p class="text-muted small mb-0">Chưa có liên hệ nào từ khách hàng ở khoảng thời gian này.</p>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      
      <div aria-label="Page navigation" th:if="${totalPage > 0}">
        <ul class="pagination justify-content-center">
          <li class="page-item" th:classappend="${page == 0} ? 'disabled'">
            <a class="page-link shadow-sm rounded-start-pill px-3 fw-bold border-0"
              th:href="@{/admin/contact(page=${page - 1}, perPage=${perPage})}">&laquo;</a>
          </li>
          <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPage - 1)}"
            th:classappend="${i == page} ? 'active'">
            <a class="page-link shadow-sm fw-bold border-0 px-3 bg-white text-dark"
              th:href="@{/admin/contact(page=${i}, perPage=${perPage})}" th:text="${i + 1}" th:if="${i != page}"></a>
            <span class="page-link shadow-sm fw-bold border-0 px-3 bg-dark text-white" th:if="${i == page}"
              th:text="${i + 1}"></span>
          </li>
          <li class="page-item" th:classappend="${page == totalPage - 1} ? 'disabled'">
            <a class="page-link shadow-sm rounded-end-pill px-3 fw-bold border-0"
              th:href="@{/admin/contact(page=${page + 1}, perPage=${perPage})}">&raquo;</a>
          </li>
        </ul>
      </div>

    </div>
  </div>
  <footer th:replace="~{layout/admin_layout :: footer()}"></footer>
</body>

</html>
